<!doctype html><meta charset=utf-8><title>微缩西雅图测试场</title><style>body{background:#192c29;color:#eee;font:16px Microsoft YaHei;margin:16px}canvas{width:min(72vw,78vh);background:#40564a;vertical-align:top}aside{display:inline-block;width:26vw;padding:14px}button,select{margin:4px;padding:6px}label{display:inline-block;margin:4px}#out{color:#ffdf99}</style><h2>08 × 10 · 载具与生存机制测试</h2><canvas width=800 height=800 id=c></canvas><aside>选择载具后点击地图道路节点设置起点，再点目的地。播放沿合法道路行驶；方向键可手动驾驶。<p><select id=v></select><button id=go>沿路线行驶</button><button id=reset>重新选起点</button></p><div id=opts></div><p id=out></p><p id=event></p><button id=act>与最近设施互动</button><button id=horn>鸣笛</button><p>黄色为设施，紫色为特殊通道。靠近节点操作可改变桥梁、供电、广播和营地状态。</p></aside><script>
const D=MAPDATA,V=D.nodes,E=D.edges,g=c.getContext('2d'),scale=800/2048;
const types={'步行':[.65,3],'自行车':[1.05,7],'摩托':[1.25,14],'轿车':[2.6,20],'卡车':[3.6,15],'船':[1,12]};for(let n in types)v.add(new Option(n,n));v.value='轿车';
for(let [id,n] of Object.entries({bridge:'中桥升起',clear:'低桥已清障',tide:'涨潮',rain:'雨天',night:'夜间',fog:'浓雾'}))opts.insertAdjacentHTML('beforeend','<label><input type=checkbox id="'+id+'">'+n+'</label>');
let start=null,end=null,pos=[440,590],route=[],run=false,angle=0,speed=0,last=performance.now(),power=false,radio=false,owned=new Set(),keys={},noise=0;
function allowed(e){let n=v.value,s=e.state;if(s==='boat'||n==='船')return s==='boat'&&n==='船';return e.gap>=types[n][0]&&s!=='closed'&&!(s==='clear'&&!clear.checked||s==='bridge'&&bridge.checked||s==='tide'&&tide.checked)}
function calc(){run=false;route=[];if(!start||!end)return;let q=[[0,start,[]]],seen=new Set();while(q.length){q.sort((a,b)=>b[0]-a[0]);let [d,u,p]=q.pop();if(u===end){route=p;out.textContent='可达 · '+Math.round(d)+' m';return}if(seen.has(u))continue;seen.add(u);for(let e of E){if(!allowed(e)||e.a!==u&&e.b!==u)continue;let w=e.a===u?e.b:e.a;q.push([d+len(V[u],V[w]),w,[...p,w]])}}out.textContent='当前状态无可用路线'}
function len(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1])}function nearest(p){return Object.keys(V).sort((a,b)=>len(V[a],p)-len(V[b],p))[0]}
c.onclick=e=>{let b=c.getBoundingClientRect(),n=nearest([(e.clientX-b.left)*2048/b.width,(e.clientY-b.top)*2048/b.height]);if(!start||end){start=n;end=null;pos=[...V[n]];route=[];run=false;out.textContent='已设起点，请点终点'}else{end=n;calc()}};reset.onclick=()=>{start=end=null;run=false;route=[];out.textContent='请点起点'};go.onclick=()=>{if(start&&end){calc();pos=[...V[start]];run=route.length>0}};v.onchange=opts.onchange=calc;
function msg(t){document.getElementById('event').textContent=t}
act.onclick=()=>{let s=D.sites.filter(s=>len(pos,[s.x,s.y])<85);if(!s.length)return msg('附近无设施');let reports=[];for(let p of s){let n=p.name;if(n.startsWith('N01'))bridge.checked=!bridge.checked;if(n.startsWith('N03'))clear.checked=true;if(n.startsWith('N04'))reports.push('净水供应开启');if(n.startsWith('N05'))radio=true;if(n.startsWith('N06'))power=true;if(p.typ==='营地')owned.add(n);reports.push(n+' · '+(n.includes('太空针')?(power?'电梯可用':'应急楼梯可用'):n.includes('广播')?'已获知北端空投':n.includes('空投')?(radio?'领取预告空投':'发现空投场'):p.typ==='营地'?'模拟清场后占领':'已互动'))}msg(reports.join(' / '));calc()};
horn.onclick=()=>{noise=performance.now()+2500;msg('警报吸引半径 '+(rain.checked?180:300)+' m')};onkeydown=e=>{if(e.key.startsWith('Arrow')){e.preventDefault();keys[e.key]=true;run=false}};onkeyup=e=>keys[e.key]=false;
function seg(p,a,b){let dx=b[0]-a[0],dy=b[1]-a[1],t=Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(dx*dx+dy*dy)));return len(p,[a[0]+dx*t,a[1]+dy*t])}
function frame(now){let dt=Math.min(.06,(now-last)/1000);last=now;let vmax=types[v.value][1]*(rain.checked?.75:1);if(run&&route.length){let dst=V[route[0]],d=len(pos,dst),step=vmax*dt*4;if(d<=step){pos=[...dst];route.shift();if(!route.length){run=false;msg('已抵达')}}else{pos=pos.map((z,i)=>z+(dst[i]-z)*step/d);angle=Math.atan2(dst[1]-pos[1],dst[0]-pos[0])}}else{speed+=(keys.ArrowUp?8:keys.ArrowDown?-10:-Math.sign(speed)*Math.min(Math.abs(speed)/dt,5))*dt;speed=Math.max(-5,Math.min(vmax,speed));angle+=((keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0))*dt*2;let p=[pos[0]+Math.cos(angle)*speed*dt,pos[1]+Math.sin(angle)*speed*dt];if(E.some(e=>allowed(e)&&seg(p,V[e.a],V[e.b])<({L1:14,L2:8,L3:4,L4:1.5,L5:2.5}[e.grade])))pos=p;else speed=0}
g.setTransform(scale,0,0,scale,0,0);g.fillStyle=night.checked?'#24332f':'#40564a';g.fillRect(0,0,2048,2048);g.fillStyle='#24485a';g.fillRect(0,440,2048,80);g.fillRect(0,520,100,1528);g.fillStyle='#87594d';g.fillRect(1070,666,300,300);for(let e of E){if(e.state==='closed')continue;g.strokeStyle=allowed(e)?({L1:'#dbb27c',L2:'#b6c9b6',L3:'#97a9a1',L4:'#efca84',L5:'#ba9bbf'}[e.grade]):'#be6557';g.lineWidth=({L1:28,L2:16,L3:8,L4:4,L5:5}[e.grade]);g.beginPath();g.moveTo(...V[e.a]);g.lineTo(...V[e.b]);g.stroke()}g.strokeStyle='#ffeb70';g.lineWidth=6;g.beginPath();g.moveTo(...pos);for(let n of route)g.lineTo(...V[n]);g.stroke();for(let s of D.sites){g.fillStyle=owned.has(s.name)?'#69dfb5':'#eaca85';g.fillRect(s.x-5,s.y-5,10,10);if(s.typ!=='T3'){g.font='23px Microsoft YaHei';g.fillText(s.name,s.x+6,s.y-5)}}if(fog.checked){g.fillStyle='#b9c6c344';g.fillRect(0,0,2048,2048)}if(noise>now){g.strokeStyle='#e09260';g.beginPath();g.arc(...pos,rain.checked?180:300,0,7);g.stroke()}g.fillStyle='#fff';g.beginPath();g.arc(...pos,10,0,7);g.fill();requestAnimationFrame(frame)}requestAnimationFrame(frame)
</script>
