<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>场景吸附编辑器</title><style>
*{box-sizing:border-box}body{margin:0;background:#172021;color:#e0e9e7;font:15px/1.5 system-ui}header,main{padding:14px 3vw}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #495a58}a{color:#b6d9c4}main{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:20px}canvas{background:#202b2b;width:100%;height:65vh;touch-action:none}button,select,input{padding:5px;font:inherit}button{cursor:pointer}aside label{display:block;margin:7px 0}input[type=number]{width:98px}fieldset{margin:10px 0;border:1px solid #52625f}#status{white-space:pre-line}#changes label{font:13px monospace}small{color:#b8c5c1}@media(max-width:800px){main{grid-template-columns:1fr}canvas{height:48vh}}</style>
<header><strong>场景吸附编辑器</strong><a id="back">返回场景</a></header><main><section><canvas></canvas><p>拖动对象预览位置。绿色可提交，黄色可带警告提交，红色需修正。</p><small>Shift 道具对格 · Ctrl 结构自由预览 · Alt 自由角 · Q / E 旋转 · F 贴地 · [ / ] 步长 · G 网格 · C 分区</small></section><aside>
<label>场景 <select id="scene"><option value="lab">吸附实验台</option><option value="station">消防局灰模</option><option value="world">大地图 · 供电区</option></select></label><label>对象 <select id="object"></select></label>
<fieldset><legend>检查器</legend><select id="profile"><option>structural</option><option>semantic</option><option>prop</option><option>decor</option></select><div id="fields"></div><label>角度步长 ° <input id="angle" type="number" min="0" placeholder="自由"></label><label>高度偏移 m <input id="offset" type="number" step=".01" value="0"></label><label><input type="checkbox" id="off">允许离格</label></fieldset>
<div id="status" role="status"></div><button id="migrate">预览本场景吸附差异</button><div id="changes"></div><button id="save" disabled>保存勾选项</button></aside></main><script type="module" src="/src/editor/snap/editor.js"></script></html>
